[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery — Satellite Image Question Answering. Predict what needs perception; calculate what can be calculated."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Every dependency below is justified by CLAUDE.md §1 (frozen architecture facts) or by a
# Stage 1 foundation requirement. Nothing speculative. See docs/architecture/IMPLEMENTATION_MAP.md §4.
dependencies = [
    # --- Geospatial I/O. CLAUDE.md §1: "rasterio only. Never PIL, OpenCV, or generic imread."
    "rasterio==1.4.3",
    # --- Numerics. M1 tensors, M2 geometry.
    "numpy==2.1.3",
    # --- M2 symbolic geometry engine (CLAUDE.md §1: scipy.ndimage + skimage.measure)
    "scipy==1.14.1",
    "scikit-image==0.24.0",
    # --- M3 (logistic regression variant), M9 (logistic + isotonic), M10 (TF-IDF + linear SVM)
    "scikit-learn==1.5.2",
    # --- M1, M5, M6, M7. Also required by utils.seed.set_global_seed (torch + CUDA seeding).
    "torch==2.5.1",
    "torchvision==0.20.1",
    # --- M3 primary variant (LightGBM ~200 trees, depth 4)
    "lightgbm==4.5.0",
    # --- Typed validation at every boundary (CLAUDE.md §9; routing plans are Pydantic-validated)
    "pydantic==2.10.3",
    # --- Hierarchical YAML configuration (CLAUDE.md §8: no magic numbers in src/)
    "pyyaml==6.0.2",
    # --- BigEarthNet.txt annotations ship as parquet
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    # --- Structured JSON logging (CLAUDE.md §9)
    "structlog==24.4.0",
    # --- Secrets loaded from .env, never from source (Stage 1 requirement 8)
    "python-dotenv==1.0.1",
    # --- reBEN's official Zenodo distribution is .tar.zst. Python 3.12 has no zstd in the
    #     stdlib (added in 3.14) and no zstd CLI is present on this machine, so the archives
    #     are unreadable without this. Added at S2.
    "zstandard==0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20240917",
    "pandas-stubs==2.2.3.241126",
]

[tool.hatch.build.targets.wheel]
packages = ["src/satquery"]

# ----------------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so shared helpers (tests/synthetic.py) import cleanly
pythonpath = ["src", "tests"]
markers = [
    "model: model-level validation; may be slow or hardware-specific",
    "unit: fast, isolated, no I/O and no network",
    "integration: crosses a component boundary",
    "slow: takes more than a few seconds",
    "gpu: requires a CUDA device",
    "benchmark: touches the quarantined benchmark split (CLAUDE.md §7)",
]
# `slow` is excluded by default: it holds sleep prevention past the machine's idle-sleep
# threshold (11 min) and is a hardware validation, not a unit test. Run it explicitly with
# `-m slow` when qualifying a new machine — see tests/model/test_keepawake_duration.py.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
filterwarnings = [
    "error::DeprecationWarning:satquery.*",
    # rasterio 1.4.3 uses `*` for Affine matmul internally; not our code, not actionable.
    "ignore:Use `@` matmul instead:PendingDeprecationWarning",
]

# ----------------------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/satquery"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ----------------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # missing type annotations
    "T20",      # flake8-print — no stray print() in src/
    "PTH",      # prefer pathlib over os.path
    "RET",      # return simplification
    "SIM",      # simplification
    "TRY",      # exception antipatterns (catches bare except)
    "E722",     # bare except
]
ignore = [
    "ANN401",   # allow typing.Any where genuinely needed
    "TRY003",   # long messages inside raise are wanted here — errors carry context
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
# Scripts are CLI entry points: printing to stdout is their job, and they are allowed to
# reach into private helpers of the module under test. Production logic still lives in src/,
# where T20 remains enforced.
"scripts/**" = ["T20"]
# One-off forensic analysis scripts. Their reusable core — the quarantine-enforcing
# loader — lives in src/satquery/evaluation/forensics.py and is held to full standards.
# These are dense exploratory queries whose value is the JSON they emit; compact
# statement style and long literal regexes are appropriate there.
"scripts/forensics/**" = ["T20", "E501", "E701", "E702", "B007", "E741"]
# One-off measurement scripts, same rationale as scripts/forensics: dense exploratory
# queries whose value is the JSON they emit.
"scripts/data/split_class_coverage.py" = ["T20", "E501", "E701", "E702"]
"scripts/data/tile_class_presence.py" = ["T20", "E501", "E701", "E702"]
"scripts/fit_geometry_conventions.py" = ["T20", "E501", "E701", "E702"]
"scripts/run_caption_oracle.py" = ["T20", "E501", "E701", "E702", "ANN", "E741", "SIM108"]

# ----------------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/satquery"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "skimage.*", "lightgbm.*", "structlog.*", "sklearn.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true
