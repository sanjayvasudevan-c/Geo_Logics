# CORINE hierarchy. CLAUDE.md §1: Level-3, 44 classes.
# The 19-class scheme is reBEN's IMAGE-LEVEL multi-label vocabulary and is NOT the
# segmentation target — it is an auxiliary head only.
primary: corine_l3
num_classes: 44
nomenclature_file: configs/taxonomy/corine_l3.yaml   # the full 44-class nomenclature

# S3 FINDING: questions are asked EXCLUSIVELY in the 19-class vocabulary, so the 19-class head
# is on the QUERY PATH, not merely auxiliary. Kept in this list because M1 still predicts L3-44
# and derives 19 by aggregation (GR-1 option A), but it is query-critical, not decorative.
auxiliary_heads: [corine_l3_19, coarse_7]
# MEASURED at S4: the reference maps use 999 for unclassified, NOT 255. The old value was a
# placeholder set at S1 before any data existed. A loader ignoring 255 would treat 999 as a
# real class index and either crash or corrupt the loss — a silent-failure bug.
ignore_index: 999

# The only level at which cross-taxonomy comparison is valid (CORINE-44 vs WorldCover-11).
# All Indian numbers are reported here and nowhere else.
coarse_7_classes:
  - built_up
  - cropland
  - tree_cover
  - grassland_shrub
  - water
  - bare_sparse
  - wetland
