# ESA WorldCover 10 m v200 -> coarse-7. Used ONLY for the India comparison at S23, the single
# level at which CORINE and WorldCover are comparable (IMPLEMENTATION_MAP §4).
worldcover_to_coarse7:
  10:  {name: Tree cover,               coarse7: tree_cover}
  20:  {name: Shrubland,                coarse7: grassland_shrub}
  30:  {name: Grassland,                coarse7: grassland_shrub}
  40:  {name: Cropland,                 coarse7: cropland}
  50:  {name: Built-up,                 coarse7: built_up}
  60:  {name: Bare / sparse vegetation, coarse7: bare_sparse}
  70:  {name: Snow and ice,             coarse7: bare_sparse}
  80:  {name: Permanent water bodies,   coarse7: water}
  90:  {name: Herbaceous wetland,       coarse7: wetland}
  95:  {name: Mangroves,                coarse7: wetland}
  100: {name: Moss and lichen,          coarse7: bare_sparse}

# SECOND 6-class semantic-change taxonomy for M6 (S17). A SEPARATE taxonomy — never mixed with
# CORINE in a loss term (IMPLEMENTATION_MAP §4.3: one taxonomy per loss term).
second_6:
  0: non-vegetated ground surface
  1: tree
  2: low vegetation
  3: water
  4: buildings
  5: playgrounds

# NOTES
# 11 of the 44 L3 classes have NO 19-class equivalent: 122, 123, 124, 131, 132, 133, 141, 142
# (artificial-surface classes beyond urban fabric and industrial units), 332 (bare rocks),
# 334 (burnt areas) and 335 (glaciers). The reBEN 19-class scheme does not represent them.
# L3->19 aggregation therefore CANNOT be a total function: those pixels go to an explicit
# `no_19_equivalent` bucket rather than being silently folded into a neighbouring class.
# S3 showed questions are asked exclusively in the 19-class vocabulary, so these classes are
# never queried at level 19 — but the bucket must exist for the aggregation to be honest about
# what it dropped.
