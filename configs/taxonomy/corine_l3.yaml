# CORINE Land Cover Level-3 nomenclature — the complete 44-class segmentation target.
#
# PROVENANCE, stated per field because it differs:
#   codes/names/L2/L1  : the official CORINE nomenclature (standard reference data).
#   index              : assigned here, contiguous 0..43 in ascending code order.
#   to_19              : DERIVED EMPIRICALLY at S4 from co-occurrence between each reference
#                        map's L3 codes and that patch's official reBEN 19-class multi-label
#                        (17,221 maps, stratified across all 54 tiles, seed 1337).
#                        provenance: derived        = confidence 1.000 in that measurement
#                        provenance: convention     = measurement ambiguous (rare class, low
#                                                     support); documented CORINE->BigEarthNet
#                                                     convention used instead
#                        provenance: no_equivalent  = the class has NO 19-class counterpart.
#                                                     A real property of the scheme, not a gap.
#   to_coarse7         : assigned here for cross-taxonomy comparison with ESA WorldCover.
#
# EMPIRICAL NOTE: a stratified scan of 17,221 maps found 43 of these 44 codes, plus 999.
# Code 335 (Glaciers and perpetual snow) was NOT observed. It is retained as a defined class
# because CLAUDE.md §1 freezes the 44-class CORINE L3 target, and glacier patches plausibly sit
# in reBEN's snow-filtered set. Expect it to be a dead output; report it, do not drop it.

unclassified:
  code: 999            # MEASURED: the value the reference maps actually use.
  name: Unclassified
  ignore_in_loss: true
  ignore_in_metrics: true
  note: >
    NOT one of the 44 classes and NOT a training index. GeoTIFF nodata is declared as 0 but 0
    never occurs; 999 is the real unclassified marker. Any loss or metric that treats 999 as a
    class is a bug.

