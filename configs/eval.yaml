# Evaluation protocol (IMPLEMENTATION_MAP §8.3).
bootstrap_resamples: 1000

# Resample over the 1,082 image PAIRS, never over annotations: annotations within a pair are
# correlated, and resampling them independently gives intervals that are too narrow.
bootstrap_unit: image_pair
confidence_level: 0.95

# Both systems answer identical items, so McNemar is correct and more powerful than
# comparing two independent proportions.
paired_test: mcnemar

# The significance floor. At ~1,700 binary annotations per sub-task the 95% CI is ~+/-2.2 pts;
# at ~700 MCQ annotations it is ~+/-3.7 pts. Differences below these are not claimable.
min_claimable_delta_binary_pts: 3.0
min_claimable_delta_mcq_pts: 4.0

# Mandatory. If the system does not clearly beat these, the benchmark is measuring language
# priors rather than perception, and that must be reported.
require_blind_baselines: true
baselines: [question_only, majority_class, class_prior]
